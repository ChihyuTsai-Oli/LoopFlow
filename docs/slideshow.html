<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoopFlow Diagrams</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #858585;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  #slide-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #slide-img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
    pointer-events: none;
  }

  .page-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    height: 100%;
    width: clamp(88px, 14vw, 180px);
    border: 0;
    padding: 0;
    background: transparent;
    color: rgba(255, 255, 255, 0.88);
    cursor: pointer;
    z-index: 10;
  }

  #left-zone  { left: 0; }
  #right-zone { right: 0; }

  .page-zone::before {
    content: '';
    position: absolute;
    top: 50%;
    width: 20px;
    height: 20px;
    border-top: 3px solid currentColor;
    border-left: 3px solid currentColor;
    opacity: 0;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
    transition: opacity 160ms ease, transform 160ms ease;
  }

  #left-zone::before {
    left: 28px;
    transform: translate(8px, -50%) rotate(-45deg);
  }

  #right-zone::before {
    right: 28px;
    transform: translate(-8px, -50%) rotate(135deg);
  }

  .page-zone:hover::before,
  .page-zone:focus-visible::before {
    opacity: 1;
  }

  #left-zone:hover::before,
  #left-zone:focus-visible::before {
    transform: translate(0, -50%) rotate(-45deg);
  }

  #right-zone:hover::before,
  #right-zone:focus-visible::before {
    transform: translate(0, -50%) rotate(135deg);
  }

  .page-zone:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.75);
    outline-offset: -4px;
  }

  @media (hover: none) {
    .page-zone::before { opacity: 0.55; }
  }

  #counter {
    position: fixed;
    bottom: 16px;
    right: 20px;
    color: rgba(255, 255, 255, 0.6);
    font-family: monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    z-index: 20;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="slide-container">
  <img id="slide-img" src="" alt="diagram">
  <button id="left-zone" class="page-zone" type="button" aria-label="上一頁" title="上一頁"></button>
  <button id="right-zone" class="page-zone" type="button" aria-label="下一頁" title="下一頁"></button>
</div>

<div id="counter"></div>

<script>
  const slides = [
    'images/diagrams/diagram_curve_1.svg',
    'images/diagrams/diagram_curve_2.svg',
    'images/diagrams/diagram_curve_3.svg',
    'images/diagrams/diagram_curve_4.svg',
    'images/diagrams/diagram_curve_5.svg',
    'images/diagrams/diagram_curve_6.svg',
    'images/diagrams/diagram_curve_7.svg',
    'images/diagrams/diagram_curve_8.svg',
    'images/diagrams/diagram_curve_9.svg',
    'images/diagrams/diagram_curve_10.svg',
    'images/diagrams/diagram_curve_11.svg',
    'images/diagrams/diagram_curve_12.svg',
    'images/diagrams/diagram_curve_13.svg',
    'images/diagrams/diagram_curve_14.svg',
    'images/diagrams/diagram_curve_15.svg',
    'images/diagrams/diagram_curve_16.svg',
  ];

  let current = 0;

  function show(index) {
    current = (index + slides.length) % slides.length;
    document.getElementById('slide-img').src = slides[current];
    document.getElementById('counter').textContent = (current + 1) + ' / ' + slides.length;
  }

  function next() { show(current + 1); }
  function prev() { show(current - 1); }

  document.getElementById('left-zone').addEventListener('click', prev);
  document.getElementById('right-zone').addEventListener('click', next);

  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault();
      next();
    }
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      prev();
    }
  });

  show(0);
</script>

</body>
</html>
